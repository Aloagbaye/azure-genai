trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - README.md
    - '*.md'

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'azure-genai-acr'
  imageRepository: 'azure-genai-api'
  containerRegistry: 'yourregistryname.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        failTaskOnFailedTests: true

- stage: Test
  displayName: 'Run Tests'
  dependsOn: Build
  jobs:
  - job: Test
    displayName: 'Run Unit Tests'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        displayName: 'Use Python 3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov requests
      displayName: 'Install dependencies'

    - script: |
        pytest tests/ --junitxml=junit/test-results.xml --cov=api --cov-report=xml || true
      displayName: 'Run tests'
      continueOnError: true

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Code Coverage'
      condition: always()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'

- stage: SecurityScan
  displayName: 'Security Scanning'
  dependsOn: Build
  jobs:
  - job: SecurityScan
    displayName: 'Scan Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Scan image for vulnerabilities'
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - script: |
        docker pull $(containerRegistry)/$(imageRepository):$(tag) || true
        echo "Security scanning would run here (e.g., Trivy, Snyk)"
      displayName: 'Run security scan'
      continueOnError: true

